[build-system]
# 构建系统要求
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# 项目基本元数据
name = "ai-data-agent"
version = "0.1.0"
description = "沙箱优先的 CSV Agent 骨架"
requires-python = ">=3.11"

# 核心依赖：FastAPI 用于 API，Uvicorn 用于 Web 服务
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    # 版本化审批规范的严格校验；显式声明，不依赖 FastAPI 的传递依赖。
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# HTTP 适配器只由模型控制进程加载，不进入作业镜像。
llm = ["httpx==0.28.1"]
# Docker SDK 仅由独立 worker/构建脚本加载，API 不会自动接入运行时。
worker = ["docker==7.1.0"]
# 可选依赖：workflow 用于 LangGraph 工作流编排
workflow = ["langgraph==1.2.19", "langgraph-checkpoint-sqlite==3.1.3"]
# 可选依赖：test 用于单元测试和 API 测试
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
# 包含的包目录
include = ["backend*", "workers*", "images*"]

[tool.pytest.ini_options]
# 测试路径配置
testpaths = ["tests"]
