[build-system]
# Build system requirements.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Project metadata.
name = "ai-data-agent"
version = "0.1.0"
description = "A sandbox-first CSV data agent"
requires-python = ">=3.11"

# FastAPI provides the API; Uvicorn serves it.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    # Validate versioned approval specifications without relying on a transitive dependency.
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# The model control process alone loads the HTTP adapter.
llm = ["httpx==0.28.1"]
# Only the worker and build scripts load the Docker SDK.
worker = ["docker==7.1.0"]
# LangGraph workflow orchestration.
workflow = ["langgraph==1.2.19", "langgraph-checkpoint-sqlite==3.1.3"]
# Unit and API tests.
test = ["httpx>=0.27,<1", "pytest>=8,<10"]
browser = ["playwright==1.56.0"]

[tool.setuptools.packages.find]
# Package discovery.
include = ["backend*", "workers*", "images*"]

[tool.pytest.ini_options]
# Test discovery.
testpaths = ["tests"]
